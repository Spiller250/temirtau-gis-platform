    itemsHtml = `<div class="history-list" id="history-items-container">` + list.map(p => `
      <div class="history-item" data-id="${p.id}">
        <div class="history-item-address">${escapeHtml(p.address || 'Без адреса')}</div>
        <div class="history-item-date">${formatDate(p.collectedAt)}${p.collectedBy ? ' · ' + escapeHtml(p.collectedBy) : ''}</div>
      </div>`).join('') + `</div>` + `<div class="history-hint">Зажмите адрес, чтобы удалить его из истории</div>`;
  }

  const searchHtml = list.length ? `
    <div style="padding: 0 14px 14px;">
      <input type="text" id="history-search-input" class="field-input" placeholder="🔍 Умный поиск по адресам..." style="background: var(--surface-deep);">
    </div>
  ` : '';

  document.getElementById('panel-body').innerHTML = `
    <div class="history-counter">
      <div class="big-num">${total}</div>
      <div class="counter-label">адресов вывезено всего</div>
    </div>
    ${searchHtml}
    ${itemsHtml}`;

  if (list.length) {
    document.getElementById('history-search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const items = document.querySelectorAll('.history-item');
      items.forEach(item => {
        const addr = item.querySelector('.history-item-address').textContent.toLowerCase();
        if (addr.includes(query)) {
          item.style.display = 'block';
        } else {
          item.style.display = 'none';
        }
      });
    });
  }
}

function updateHistoryBadge() {
  document.getElementById('history-badge').textContent = allPoints.filter(p => p.status === 'collected').length;
}

async function deleteFromHistory(id) {
  const p = allPoints.find(x => x.id === id);
  try {
    if (FIRESTORE_AVAILABLE) {
      await db.collection('points').doc(id).delete();
      if (p && p.videoUrl && p.videoUrl.includes('firebasestorage') && STORAGE_BUCKET_AVAILABLE) {
        firebase.storage().refFromURL(p.videoUrl).delete().catch(() => {});
      }
      deleteCardPhotos(p);
    } else {
      allPoints = allPoints.filter(x => x.id !== id);
      updateHistoryBadge();
      renderHistoryPanel(getSortedCollected());
    }
    showToast('Запись удалена из истории');
  } catch (err) {
    showToast('Не удалось удалить, попробуйте ещё раз');
  }
}

let pressTimer = null;
let pressStartXY = null;
let pressMoved = false;
let suppressNextClick = false;

function bindHistoryLongPress() {
  const body = document.getElementById('panel-body');

  function start(id, x, y) {
    pressMoved = false;
    pressStartXY = { x, y };
    pressTimer = setTimeout(() => {
      if (!pressMoved) askDeletePassword(id);
    }, 600);
  }
  function move(x, y) {
    if (!pressStartXY) return;
    if (Math.abs(x - pressStartXY.x) > 12 || Math.abs(y - pressStartXY.y) > 12) {
      pressMoved = true;
      clearTimeout(pressTimer);
    }
  }
  function cancel() { clearTimeout(pressTimer); }

  body.addEventListener('touchstart', (e) => {
    const item = e.target.closest('.history-item');
    if (!item) return;
    const t = e.touches[0];
    start(item.dataset.id, t.clientX, t.clientY);
  }, { passive: true });
  body.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    move(t.clientX, t.clientY);
  }, { passive: true });
  body.addEventListener('touchend', cancel);
  body.addEventListener('touchcancel', cancel);

  body.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.history-item');
    if (!item) return;
    start(item.dataset.id, e.clientX, e.clientY);
  });
  body.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
  body.addEventListener('mouseup', cancel);
  body.addEventListener('mouseleave', cancel);

  body.addEventListener('click', (e) => {
    const item = e.target.closest('.history-item');
    if (!item) return;
    if (suppressNextClick) { suppressNextClick = false; return; }
    openPointDetail(item.dataset.id);
  });
}

function askDeletePassword(id) {
  suppressNextClick = true;
  if (!isAdmin) {
    showToast('Удаление доступно только администраторам');
    return;
  }
  if (confirm('Удалить эту точку из истории? Действие нельзя отменить.')) {
    deleteFromHistory(id);
  }
}

function loadMyName() {
  try { myName = localStorage.getItem('trash-map-my-name') || ''; } catch (err) { myName = ''; }
}
function saveMyName(name) {
  myName = name;
  try { localStorage.setItem('trash-map-my-name', name); } catch (err) { }
}

function bindUI() {
  document.getElementById('search-btn').addEventListener('click', () => { hideSearchSuggestions(); handleSearch(); });
  document.getElementById('search-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); hideSearchSuggestions(); handleSearch(); }
    if (e.key === 'Escape') { hideSearchSuggestions(); }
  });
  let searchSuggestTimer = null;
  document.getElementById('search-input').addEventListener('input', (e) => {
    clearTimeout(searchSuggestTimer);
    const val = e.target.value;
    searchSuggestTimer = setTimeout(() => updateSearchSuggestions(val), 120);
  });
  document.getElementById('search-input').addEventListener('focus', (e) => {
    if (e.target.value.trim().length >= 2) updateSearchSuggestions(e.target.value);
  });
  document.getElementById('search-input').addEventListener('blur', () => {
    setTimeout(hideSearchSuggestions, 150);
  });
  document.getElementById('locate-btn').addEventListener('click', handleLocateMe);
  document.getElementById('route-info-close').addEventListener('click', clearRoute);
  document.getElementById('route-panel-close').addEventListener('click', closeRoutePanel);
  document.getElementById('route-btn').addEventListener('click', () => {
    const panel = document.getElementById('route-panel');
    panel.classList.contains('hidden') ? openRoutePanelBlank() : closeRoutePanel();
  });
  document.getElementById('route-from-geo').addEventListener('click', handleRouteFromGeo);
  document.getElementById('route-from-show').addEventListener('click', () => handleRouteShow('from'));
  document.getElementById('route-to-show').addEventListener('click', () => handleRouteShow('to'));
  document.getElementById('route-build-btn').addEventListener('click', handleRouteBuild);
  document.querySelectorAll('.route-profile-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      routeProfile = btn.dataset.profile;
      document.querySelectorAll('.route-profile-btn').forEach(b => b.classList.toggle('active', b === btn));
    });
  });
  document.getElementById('history-btn').addEventListener('click', openHistoryPanel);
  document.getElementById('admin-btn').addEventListener('click', handleAdminAuth);
  document.getElementById('panel-close-btn').addEventListener('click', closePanel);
  document.getElementById('backdrop').addEventListener('click', closePanel);
  
  // Кнопка инфо
  document.getElementById('info-btn-circle').addEventListener('click', () => {
    document.getElementById('info-panel-box').classList.remove('hidden');
    document.getElementById('info-btn-circle').style.display = 'none';
  });
  document.getElementById('info-close-btn').addEventListener('click', () => {
    document.getElementById('info-panel-box').classList.add('hidden');
    document.getElementById('info-btn-circle').style.display = 'flex';
  });

  bindHistoryLongPress();

  // Отслеживаем активный раздел для защиты от добавления точек
  const switcher = document.querySelector('.section-switcher');
  if (switcher) {
    switcher.addEventListener('click', (e) => {
      const tab = e.target.closest('.section-tab');
      if (tab) {
        const sec = tab.dataset.section;
        document.body.setAttribute('data-section', sec);
        localStorage.setItem('trash-map-section', sec); // Сохраняем секцию
        document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      }
    });
  }
}

function showToast(msg, duration = 3200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), duration);
}

function formatDate(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (err) {
    return '—';
  }
}

function geoErrorMessage(err) {
  switch (err.code) {
    case err.PERMISSION_DENIED: return 'доступ к геолокации запрещён (разрешите его в настройках браузера)';
    case err.POSITION_UNAVAILABLE: return 'не удалось определить позицию';
    case err.TIMEOUT: return 'превышено время ожидания';
    default: return 'неизвестная ошибка';
  }
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function setSearchLoading(loading) {
  const btn = document.getElementById('search-btn');
  btn.disabled = loading;
  btn.textContent = loading ? '⏳' : '🔍';
}

function setLocateLoading(loading) {
  const btn = document.getElementById('locate-btn');
  btn.disabled = loading;
  if (loading) btn.textContent = '⏳';
  else if (!btn.classList.contains('locate-active')) btn.textContent = '🎯';
}

function setLocateActive(active) {
  const btn = document.getElementById('locate-btn');
  btn.classList.toggle('locate-active', active);
  btn.textContent = active ? '🎯' : '🎯';
  btn.title = active ? 'Слежение включено (нажмите, чтобы выключить)' : 'Моё местоположение';
}
